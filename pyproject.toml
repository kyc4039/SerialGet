[project]
name = "serialget"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.2.2",
    "future>=1.0.0",
    "iso8601>=2.1.0",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "streamlit>=1.63.0",
    "streamlit-autorefresh>=1.0.1",
]

[project.scripts]
serialget = "serialget:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false